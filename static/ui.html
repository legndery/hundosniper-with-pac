<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hundo sniper · live</title>
<style>
:root {
  color-scheme: light dark;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --line: #e1e0d9; --border: rgba(11,11,11,0.10); --accent: #2a78d6; --track: #f0efec;
  --good: #006300; --bad: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --line: #2c2c2a; --border: rgba(255,255,255,0.10); --accent: #3987e5; --track: #2c2c2a;
    --good: #0ca30c; --bad: #e66767;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 24px 18px 48px; }
h1 { font-size: 22px; margin: 0; }
h2 { font-size: 15px; margin: 0 0 8px; }
.sub { color: var(--ink-2); margin: 2px 0 16px; font-size: 13px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
.dot.live { background: var(--good); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.tile .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tile .l { color: var(--ink-2); font-size: 12px; }
.bar { height: 8px; background: var(--track); border-radius: 0 4px 4px 0; margin-top: 8px; }
.bar > div { height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; transition: width .5s; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; margin-bottom: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); }
th { color: var(--ink-2); font-weight: 600; }
td.n { text-align: right; font-variant-numeric: tabular-nums; }
.ok { color: var(--good); font-weight: 600; } .no { color: var(--bad); font-weight: 600; }
.empty { color: var(--muted); font-size: 13px; }
#feed { font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; max-height: 340px; overflow: auto; }
#feed div { padding: 1px 0; border-bottom: 1px dotted var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#feed .t { color: var(--muted); } #feed .k { color: var(--accent); }
label { color: var(--ink-2); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Hundo sniper</h1>
  <p class="sub"><span class="dot" id="live"></span><span id="conn">connecting…</span> · <span id="meta"></span></p>

  <div class="tiles">
    <div class="card tile"><div class="v" id="cooldown">–</div><div class="l">waited since last catch</div><div class="bar"><div id="cdbar" style="width:0%"></div></div></div>
    <div class="card tile"><div class="v" id="viable">–</div><div class="l">viable / fresh spawns</div></div>
    <div class="card tile"><div class="v" id="today">–</div><div class="l">caught / tried (session)</div></div>
    <div class="card tile"><div class="v" id="species">–</div><div class="l">species in caught list</div></div>
    <div class="card tile"><div class="v" id="state">–</div><div class="l" id="statel">bot state</div></div>
  </div>

  <div class="grid">
    <div class="card"><h2>Current plan</h2><div id="plan" class="empty">waiting for a plan…</div></div>
    <div class="card"><h2>Viable now (top 15 by cooldown)</h2><div id="top" class="empty">waiting for a poll…</div></div>
  </div>

  <div class="grid">
    <div class="card"><h2>Catches</h2><div id="results" class="empty">no attempts yet</div></div>
    <div class="card"><h2>Live feed <label><input type="checkbox" id="noisy"> show adb/logcat/pages</label></h2><div id="feed"></div></div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const time = (ms) => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const mins = (ms) => (ms / 60000).toFixed(ms < 600000 ? 1 : 0) + "m";
const NOISY = new Set(["adb", "logcat", "pokex-page", "pokemap-fetch"]);

let names = {};
let lastActionAt = 0;
let sessionStart = 0;
const commits = {};
const results = [];
let botState = "starting";
const feed = [];

function table(cols, rows) {
  return `<table><thead><tr>${cols.map((c) => `<th${c.n ? ' style="text-align:right"' : ""}>${c.h}</th>`).join("")}</tr></thead><tbody>${rows
    .map((r) => `<tr>${cols.map((c) => `<td${c.n ? ' class="n"' : ""}>${c.html ? c.v(r) : esc(c.v(r))}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

function setState(text, detail = "") {
  botState = text;
  $("state").textContent = text;
  $("statel").textContent = detail || "bot state";
}

function renderCooldown() {
  if (!lastActionAt) return;
  const waited = Date.now() - lastActionAt;
  $("cooldown").textContent = mins(waited);
  $("cdbar").style.width = Math.min(100, (waited / (120 * 60000)) * 100) + "%";
}

function renderResults() {
  const mine = results.filter((r) => r.at >= sessionStart);
  $("today").textContent = `${mine.filter((r) => r.caught).length} / ${mine.length}`;
  if (!results.length) return;
  $("results").className = "";
  $("results").innerHTML = table([
    { h: "Time", v: (r) => time(r.at) },
    { h: "", v: (r) => (r.caught ? '<span class="ok">✔</span>' : '<span class="no">✘</span>'), html: 1 },
    { h: "Pokémon", v: (r) => commits[r.uniqueId]?.name || names[parseInt(r.uniqueId)] || r.uniqueId },
    { h: "Source", v: (r) => commits[r.uniqueId]?.source || "" },
    { h: "Hop", v: (r) => (commits[r.uniqueId] ? commits[r.uniqueId].distanceKm.toFixed(1) + " km" : ""), n: 1 },
    { h: "Catch", v: (r) => Math.round(r.catchWaitMs / 1000) + "s", n: 1 },
  ], results.slice(-25).reverse());
}

function renderFeedLine(e) {
  const detail = { ...e }; delete detail.at; delete detail.type; delete detail.top; delete detail.stops;
  const text = JSON.stringify(detail);
  return `<div><span class="t">${time(e.at)}</span> <span class="k">${esc(e.type)}</span> ${esc(text.length > 160 ? text.slice(0, 160) + "…" : text)}</div>`;
}
function renderFeed() {
  const show = $("noisy").checked ? feed : feed.filter((e) => !NOISY.has(e.type));
  $("feed").innerHTML = show.slice(-80).reverse().map(renderFeedLine).join("");
}

function handle(e) {
  feed.push(e);
  if (feed.length > 500) feed.shift();
  switch (e.type) {
    case "start":
      sessionStart = e.at; lastActionAt = e.lastActionAt;
      setState("running", `started ${time(e.at)}`); break;
    case "reset":
      setState("reset", e.fromPhone ? "location read from phone" : "kept saved location"); break;
    case "poll":
      $("viable").textContent = `${e.viable} / ${e.fresh}`;
      if (e.lastActionAt) lastActionAt = e.lastActionAt;
      if (e.top?.length) {
        $("top").className = "";
        $("top").innerHTML = table([
          { h: "Pokémon", v: (m) => m[1] }, { h: "Source", v: (m) => m[9] || "" },
          { h: "Hop", v: (m) => m[5].toFixed(1) + " km", n: 1 }, { h: "Wait", v: (m) => mins(m[7]), n: 1 },
          { h: "Despawn", v: (m) => time(m[4] * 1000), n: 1 },
        ], e.top);
      } else { $("top").className = "empty"; $("top").textContent = "nothing viable right now"; }
      if (botState !== "catching") setState("polling", `last poll ${time(e.at)}`);
      break;
    case "plan":
      if (e.stops?.length) {
        $("plan").className = "";
        $("plan").innerHTML = table([
          { h: "#", v: (s) => e.stops.indexOf(s) + 1, n: 1 }, { h: "Pokémon", v: (s) => s.name },
          { h: "Value", v: (s) => s.value.toFixed(1), n: 1 }, { h: "Arrive", v: (s) => time(s.plannedArrival), n: 1 },
          { h: "Despawn", v: (s) => time(s.despawnAt), n: 1 },
        ], e.stops) + `<p class="empty">route value ${e.value.toFixed(2)} · ${e.candidates} candidates · planned ${time(e.at)}</p>`;
      } else { $("plan").className = "empty"; $("plan").textContent = "no route possible right now"; }
      break;
    case "defer": setState("waiting", `next stop in ${mins(e.cooldownMs)}, re-planning`); break;
    case "commit":
      commits[e.uniqueId] = e;
      setState("catching", `${e.name} · wait ${mins(e.cooldownMs)}`); break;
    case "teleport": setState("catching", `teleported · ${mins(e.despawnLeftMs)} to despawn`); break;
    case "result": results.push(e); renderResults(); break;
    case "done": lastActionAt = e.at; setState("polling", `done ${time(e.at)}`); break;
    case "unhealthy": setState("unhealthy", e.hint); break;
    case "error": setState("error", e.message); break;
  }
}

async function init() {
  const s = await (await fetch("/api/status")).json();
  names = s.names; lastActionAt = s.lastActionAt;
  $("species").textContent = s.caughtSpecies;
  $("meta").textContent = `sources: ${s.sources.join(", ")} · pokex ${s.pokexCountry} · refresh ${s.refreshMs / 1000}s · planner ${s.routePlanner ? "on" : "off"}`;
  const es = new EventSource("/api/events");
  es.onopen = () => { $("live").className = "dot live"; $("conn").textContent = "live"; };
  es.onerror = () => { $("live").className = "dot"; $("conn").textContent = "disconnected, retrying…"; };
  let pending = false;
  es.onmessage = (m) => {
    handle(JSON.parse(m.data));
    if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; renderFeed(); renderCooldown(); }); }
  };
  $("noisy").onchange = renderFeed;
  setInterval(renderCooldown, 1000);
  setInterval(async () => { try { $("species").textContent = (await (await fetch("/api/status")).json()).caughtSpecies; } catch {} }, 30000);
}
init();
</script>
</body>
</html>
